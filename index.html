<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>F&O Live Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#0a0e17;--card:#121826;--surface:#1a2234;--border:#2a3448;--text:#e8eef8;--muted:#8b9bb4;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--yellow:#eab308}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:30px}
#loginOverlay{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:9999}
#loginOverlay.hidden{display:none}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 22px;width:92%;max-width:380px}
.login-box h2{font-size:1.25rem;margin-bottom:4px}
.login-box p{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.login-box label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.login-box input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:#0d1320;color:var(--text);font-size:.95rem;margin-bottom:14px}
.login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;font-size:1rem;cursor:pointer}
.login-error{color:var(--red);font-size:.85rem;margin-top:10px;text-align:center}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.idx-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.8rem;display:flex;gap:6px;align-items:center}
.idx-pill .name{color:var(--muted);font-weight:500}
.idx-pill .val{font-weight:600}
.idx-pill .chg.pos{color:var(--green)}
.idx-pill .chg.neg{color:var(--red)}
.breadth{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.8rem}
.breadth .adv{color:var(--green);font-weight:600}
.breadth .dec{color:var(--red);font-weight:600}
.toggle-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.toggle-btn{padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.78rem;cursor:pointer}
.toggle-btn.on{background:rgba(34,197,94,.2);border-color:var(--green);color:var(--green)}
.toggle-btn.off{background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red)}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 8px;overflow-x:auto}
.tab{flex:1;min-width:90px;text-align:center;padding:11px 8px;font-size:.88rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--blue);background:rgba(59,130,246,.08);border-radius:10px 10px 0 0}
.tab-content{display:none;padding:10px}
.tab-content.active{display:block}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:900px}
th,td{padding:7px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid #1e293b}
th{background:#151c2c;color:var(--muted);font-weight:500;position:sticky;top:0;font-size:.7rem;z-index:2}
.col-rank{width:30px;font-weight:700;color:var(--muted)}
.col-stock{text-align:left!important;min-width:110px;font-weight:600}
.col-stock a{color:var(--text);text-decoration:none}
.col-stock a:hover{color:var(--blue);text-decoration:underline}
.col-stock small{display:block;font-weight:400;color:var(--muted);font-size:.68rem}
.col-delta{min-width:40px}
.col-pct{min-width:52px;font-weight:600}
.pos{color:var(--green)!important}
.neg{color:var(--red)!important}
.hist-cell{font-size:.72rem;color:var(--muted);min-width:34px}
.hist-cell.top3{color:var(--green);font-weight:700}
.hist-cell.hot{color:var(--yellow);font-weight:700}
.hist-cell.big-up{background:rgba(34,197,94,.25);color:var(--green);font-weight:700;border-radius:4px}
.hist-cell.big-down{background:rgba(239,68,68,.25);color:var(--red);font-weight:700;border-radius:4px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.chart-box h3{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.chart-container{height:220px;position:relative}
#sectorList{margin-top:14px;max-height:360px;overflow-y:auto;display:none;scroll-margin-top:20px}
#sectorList.visible{display:block}
#sectorList h4{font-size:.85rem;margin-bottom:8px;color:var(--text)}
.sec-stock{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #1e293b;font-size:.82rem}
.status{font-size:.72rem;color:var(--muted);text-align:center;margin-top:8px}
.error-banner{display:none;background:rgba(239,68,68,.12);border:1px solid var(--red);color:var(--red);padding:10px 14px;margin:10px;border-radius:10px;font-size:.82rem;line-height:1.4}
.error-banner.show{display:block}
.error-banner button{margin-left:6px;background:var(--red);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:.74rem;cursor:pointer}
.log-wrap{max-height:65vh;overflow-y:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.log-entry{padding:7px 10px;border-bottom:1px solid #1e293b;font-size:.74rem;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.log-entry.error{color:var(--red)}
.log-entry.info{color:var(--text)}
.log-time{color:#5c6b85;margin-right:8px}
.log-empty{padding:16px;text-align:center;color:var(--muted);font-size:.8rem}
.log-actions{display:flex;justify-content:flex-end;padding:8px 4px}
.log-actions button{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:.72rem;cursor:pointer}
</style>
</head>
<body>
<div id="loginOverlay">
<div class="login-box">
<h2>F&O Live Dashboard</h2>
<p>Enter Fyers credentials (today's access token)</p>
<label>App ID</label>
<input type="text" id="appId" placeholder="XXXXXX-100" autocomplete="off"/>
<label>Access Token</label>
<input type="password" id="accessToken" placeholder="Paste access token" autocomplete="off"/>
<button onclick="doLogin()">Login & Start Dashboard</button>
<div class="login-error" id="loginError"></div>
</div>
</div>

<div id="dashboard" style="display:none">
<div class="topbar">
<div class="idx-pill"><span class="name">NIFTY</span><span class="val" id="niftyVal">—</span><span class="chg" id="niftyChg">—</span></div>
<div class="idx-pill"><span class="name">BANKNIFTY</span><span class="val" id="bnVal">—</span><span class="chg" id="bnChg">—</span></div>
<div class="breadth"><span class="adv" id="advCount">0</span> adv · <span class="dec" id="decCount">0</span> dec</div>
<div class="toggle-wrap">
<span>Auto Refresh</span>
<button id="toggleBtn" class="toggle-btn on" onclick="toggleAutoRefresh()">ON</button>
<button id="logoutBtn" class="toggle-btn off" onclick="doLogout()" title="Clear saved token and log in again">Logout</button>
</div>
</div>

<div class="tabs">
<div class="tab active" data-tab="gainers" onclick="switchTab(this)">↗ Gainers</div>
<div class="tab" data-tab="losers" onclick="switchTab(this)">↘ Losers</div>
<div class="tab" data-tab="sectors" onclick="switchTab(this)">▣ Sectors</div>
<div class="tab" data-tab="logs" onclick="switchTab(this)">⚠ Logs <span id="logBadge"></span></div>
</div>

<div id="errorBanner" class="error-banner"></div>

<div id="gainers" class="tab-content active">
<div class="table-wrap"><table>
<thead><tr id="gainerHead"><th class="col-rank">#</th><th class="col-stock">STOCK</th><th class="col-delta">Δ</th><th class="col-pct">%</th></tr></thead>
<tbody id="gainerBody"></tbody>
</table></div>
<div class="status" id="statusBar">Connecting…</div>
</div>

<div id="losers" class="tab-content">
<div class="table-wrap"><table>
<thead><tr id="loserHead"><th class="col-rank">#</th><th class="col-stock">STOCK</th><th class="col-delta">Δ</th><th class="col-pct">%</th></tr></thead>
<tbody id="loserBody"></tbody>
</table></div>
</div>

<div id="sectors" class="tab-content">
<div class="chart-box">
<h3>Sectoral Performance — click bar for stocks</h3>
<div class="chart-container"><canvas id="sectorChart"></canvas></div>
<div id="sectorList"></div>
</div>
</div>

<div id="logs" class="tab-content">
<div class="log-actions"><button onclick="clearLogs()">Clear</button></div>
<div class="log-wrap" id="logList"><div class="log-empty">No log entries yet.</div></div>
</div>

</div>

<script>
let authHeader="",timer=null,autoRefresh=true,sectorChart=null,lastData=null;
let logBuf=[],lastServerLogTs=0,serverLogsAvailable=true;

function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}

function addLog(level,msg){
logBuf.unshift({t:new Date().toLocaleTimeString("en-IN"),level,msg:String(msg)});
if(logBuf.length>300)logBuf.pop();
renderLogs();
if(level==="error")showError(msg);
}

function renderLogs(){
const el=document.getElementById("logList");
if(!logBuf.length){el.innerHTML='<div class="log-empty">No log entries yet.</div>';return}
el.innerHTML=logBuf.map(l=>`<div class="log-entry ${l.level}"><span class="log-time">${l.t}</span>${escapeHtml(l.msg)}</div>`).join("");
const badge=document.getElementById("logBadge");
const errCount=logBuf.filter(l=>l.level==="error").length;
badge.textContent=errCount?"("+errCount+")":"";
}

function clearLogs(){logBuf=[];renderLogs()}

function showError(msg){
const b=document.getElementById("errorBanner");
const lower=String(msg||"").toLowerCase();
let hint="";
if(lower.includes("token")||lower.includes("auth")||lower.includes("401")||lower.includes("expire")||lower.includes("invalid")){
hint=" This usually means today's Fyers access token is missing, wrong, or expired — Fyers tokens are valid for one trading day only. Generate a fresh token and re-login.";
}
b.innerHTML=`⚠ ${escapeHtml(msg)}${hint} <button onclick="doLogout()">Logout &amp; Re-login</button>`;
b.classList.add("show");
}

function clearError(){document.getElementById("errorBanner").classList.remove("show")}

function doLogout(){
localStorage.removeItem("fyers_auth");
localStorage.removeItem("fyers_auth_date");
if(timer){clearInterval(timer);timer=null}
location.reload();
}

function doLogin(){
const appId=document.getElementById("appId").value.trim();
let token=document.getElementById("accessToken").value.trim();
const err=document.getElementById("loginError");err.textContent="";
if(!appId||!token){err.textContent="App ID and Access Token required";return}
if(!token.includes(":"))token=appId+":"+token;
authHeader=token;
fetch("/api/dashboard",{headers:{Authorization:authHeader}})
.then(r=>r.json()).then(data=>{
if(data.error)throw new Error(data.error);
localStorage.setItem("fyers_auth",authHeader);
localStorage.setItem("fyers_auth_date",new Date().toDateString());
document.getElementById("loginOverlay").classList.add("hidden");
document.getElementById("dashboard").style.display="block";
clearError();
addLog("info","Logged in and started feed");
startFeed();
}).catch(e=>{err.textContent="Login failed: "+e.message;addLog("error","Login failed: "+e.message)});
}

window.onload=()=>{
const s=localStorage.getItem("fyers_auth");
const d=localStorage.getItem("fyers_auth_date");
const today=new Date().toDateString();
if(s&&d===today){
authHeader=s;
document.getElementById("loginOverlay").classList.add("hidden");
document.getElementById("dashboard").style.display="block";
addLog("info","Resuming saved session from today");
startFeed();
}else if(s&&d!==today){
addLog("info","Saved token was from "+d+" (today is "+today+") — Fyers tokens expire daily, please log in again with a fresh access token.");
localStorage.removeItem("fyers_auth");
localStorage.removeItem("fyers_auth_date");
}
};

function toggleAutoRefresh(){
autoRefresh=!autoRefresh;
const btn=document.getElementById("toggleBtn");
if(autoRefresh){btn.textContent="ON";btn.className="toggle-btn on";startFeed()}
else{btn.textContent="OFF";btn.className="toggle-btn off";if(timer){clearInterval(timer);timer=null}}
}

function switchTab(el){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
el.classList.add("active");
document.getElementById(el.dataset.tab).classList.add("active");
if(el.dataset.tab==="sectors"&&lastData)renderSectorChart(lastData.sectors);
}

function startFeed(){if(timer)clearInterval(timer);poll();if(autoRefresh)timer=setInterval(poll,60000)}

async function fetchServerLogs(){
if(!serverLogsAvailable)return;
try{
const r=await fetch("/api/logs",{headers:{Authorization:authHeader}});
if(r.status===404){serverLogsAvailable=false;return}
if(!r.ok)return;
const d=await r.json();
if(!Array.isArray(d.logs))return;
const fresh=d.logs.filter(l=>(l.ts||0)>lastServerLogTs).sort((a,b)=>(a.ts||0)-(b.ts||0));
fresh.forEach(l=>{
addLog(l.level==="error"?"error":"info","[server] "+l.msg);
if(l.ts>lastServerLogTs)lastServerLogTs=l.ts;
});
}catch(_){}
}

async function poll(){
try{
const res=await fetch("/api/dashboard",{headers:{Authorization:authHeader}});
let data;
try{data=await res.json()}catch(pe){throw new Error("Server returned a non-JSON / unexpected response (HTTP "+res.status+"). It may have crashed — check Render logs.")}
if(!res.ok&&!data.error){throw new Error("HTTP "+res.status+" from /api/dashboard")}
if(data.error)throw new Error(data.error);
lastData=data;render(data);
clearError();
let msg="Live • "+(data.times?.length||0)+" time slots";
if(data.backfillInProgress)msg+=" • Building history…";
else if(data.backfillDone)msg+=" • History ready";
msg+=" • "+new Date().toLocaleTimeString("en-IN");
document.getElementById("statusBar").textContent=msg;
}catch(e){
document.getElementById("statusBar").textContent="Error: "+e.message;
addLog("error",e.message);
}
fetchServerLogs();
}

function render(data){
document.getElementById("niftyVal").textContent=data.nifty.lp||"—";
const nc=document.getElementById("niftyChg");
nc.textContent=(data.nifty.chp>=0?"+":"")+(data.nifty.chp||0)+"%";
nc.className="chg "+(data.nifty.chp>=0?"pos":"neg");
document.getElementById("bnVal").textContent=data.banknifty.lp||"—";
const bc=document.getElementById("bnChg");
bc.textContent=(data.banknifty.chp>=0?"+":"")+(data.banknifty.chp||0)+"%";
bc.className="chg "+(data.banknifty.chp>=0?"pos":"neg");
document.getElementById("advCount").textContent=data.advances;
document.getElementById("decCount").textContent=data.declines;
const times=data.times||[];
updateHead("gainerHead",times);updateHead("loserHead",times);
renderTable("gainerBody",data.gainers,true,times);
renderTable("loserBody",data.losers,false,times);
if(document.querySelector(".tab[data-tab='sectors']").classList.contains("active"))renderSectorChart(data.sectors);
}

function updateHead(id,times){
const tr=document.getElementById(id);
while(tr.children.length>4)tr.removeChild(tr.lastChild);
times.forEach(t=>{const th=document.createElement("th");th.textContent=t;th.style.fontSize="0.68rem";tr.appendChild(th)});
}

function tvUrl(name){return"https://www.tradingview.com/chart/?symbol=NSE%3A"+encodeURIComponent(name)+"&interval=5"}

function renderTable(bodyId,list,isGainer,times){
const tbody=document.getElementById(bodyId);tbody.innerHTML="";
list.forEach(s=>{
const tr=document.createElement("tr");
const rank=isGainer?s.rankG:s.rankL;
const diff=isGainer?s.diffG:s.diffL;
const diffTxt=diff>0?"↑"+diff:(diff<0?"↓"+Math.abs(diff):"–");
const diffCls=diff>0?"pos":(diff<0?"neg":"");
const chpCls=s.chp>=0?"pos":"neg";
const sign=s.chp>=0?"+":"";
let histHtml="",prevRank=null;
const hist=s.hist||[];
times.forEach(t=>{
const h=hist.find(x=>x.t===t);
const r=h?(isGainer?h.g:h.l):"–";
let cls="hist-cell";
if(typeof r==="number"){
if(r===1)cls+=" top3";
else if(r<=5)cls+=" hot";
if(prevRank!==null){
const shift=prevRank-r;
if(shift>=20)cls+=" big-up";
else if(shift<=-20)cls+=" big-down";
}
prevRank=r;
}
histHtml+=`<td class="${cls}">${r}</td>`;
});
tr.innerHTML=`
<td class="col-rank">${rank}</td>
<td class="col-stock"><a href="${tvUrl(s.name)}" target="_blank" rel="noopener">${s.name}</a><small>${s.sector}</small></td>
<td class="col-delta ${diffCls}">${diffTxt}</td>
<td class="col-pct ${chpCls}">${sign}${s.chp}%</td>
${histHtml}`;
tbody.appendChild(tr);
});
}

function renderSectorChart(sectors){
const ctx=document.getElementById("sectorChart").getContext("2d");
const labels=sectors.map(s=>s.name);
const values=sectors.map(s=>s.avg);
const colors=values.map(v=>v>=0?"rgba(34,197,94,0.75)":"rgba(239,68,68,0.75)");
if(sectorChart){
sectorChart.data.labels=labels;
sectorChart.data.datasets[0].data=values;
sectorChart.data.datasets[0].backgroundColor=colors;
sectorChart.update();return;
}
sectorChart=new Chart(ctx,{
type:"bar",
data:{labels,datasets:[{label:"Avg %",data:values,backgroundColor:colors,borderRadius:3}]},
options:{
indexAxis:"y",responsive:true,maintainAspectRatio:false,
onClick:(evt,els)=>{if(!els.length)return;showSectorStocks(sectors[els[0].index])},
plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw+"%"}}},
scales:{
x:{grid:{color:"#2a3448"},ticks:{color:"#8b9bb4",callback:v=>v+"%",font:{size:10}}},
y:{grid:{display:false},ticks:{color:"#e8eef8",font:{size:10}}}
}
}
});
}

function showSectorStocks(sec){
const box=document.getElementById("sectorList");
box.classList.add("visible");
let html=`<h4>${sec.name} — sorted by % change</h4>`;
(sec.stocks||[]).forEach(s=>{
const cls=s.chp>=0?"pos":"neg";
const sign=s.chp>=0?"+":"";
html+=`<div class="sec-stock"><a href="${tvUrl(s.name)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${s.name}</a><span class="${cls}">${sign}${s.chp}% &nbsp; ${s.ltp}</span></div>`;
});
box.innerHTML=html;
setTimeout(()=>box.scrollIntoView({behavior:"smooth",block:"start"}),50);
}

window.addEventListener("error",e=>{addLog("error","Client JS error: "+(e.message||e))});
window.addEventListener("unhandledrejection",e=>{addLog("error","Unhandled promise rejection: "+(e.reason&&e.reason.message||e.reason))});
</script>
</body>
</html>
