services:
  - type: web
    name: fyers-fno-dashboard
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fyers-fno-db
          property: connectionString
      - key: VIRTUAL_CAPITAL
        value: 30000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_ACCESS_TOKEN
        sync: false

databases:
  - name: fyers-fno-db
    plan: free
    region: oregon
    databaseName: fyers_fno
    user: fyers_user
